# Popamp Bar: Popamp Modern with a bar across the screen for a main window.
# Own artwork; labels are DejaVu Sans Condensed Bold outlines.

[meta]
name = "Popamp Bar"
author = "Popamp"
format_version = 1

[text]
size = 7
color = "#8fd6ff"

[clock]
size = 10
color = "#8fd6ff"

[playlist]
normal = "#9fd8ff"
current = "#ffffff"
normal_bg = "#0d1720"
selected_bg = "#24496f"

[vis]
colors = ["#0a131b", "#1b2a36", "#ffffff", "#e3f2ff", "#c8e4ff", "#acd7ff", "#90caff", "#74bcff", "#59afff", "#3da2ff", "#2d95f6", "#2a88e3", "#267cd0", "#226fbe", "#1f63ab", "#1b5698", "#184a86", "#143d73", "#ffffff", "#c8e8ff", "#8fd6ff", "#4fb0f0", "#2f9bff", "#ffffff"]

# --- bar: the main window ---

[[window]]
key = "main"
placement = "bar-bottom"
empty_press = "nothing"

[window.normal]
size = [640, 14]

[[window.normal.element]]
type = "image"
edges = [0, 0, "end", 14]
normal = "bar/body.svg"
fill = "tile"

[[window.normal.element]]
type = "button"
rect = [3, 2, 10, 10]
normal = { file = "common/menu.svg", area = [0, 0, 10, 10] }
pressed = { file = "common/menu.svg", area = [10, 0, 10, 10] }
menu_press = "main"
cursor = "mainmenu"
tip = "Main Menu"

[[window.normal.element]]
type = "button"
rect = [16, 1, 12, 12]
normal = { file = "bar/prev.svg", area = [0, 0, 12, 12] }
pressed = { file = "bar/prev.svg", area = [12, 0, 12, 12] }
hit = { file = "bar/prev.svg", area = [0, 0, 12, 12] }
click = "previous"
shift = "back5s"
ctrl = "start-of-list"
menu = "previous"
tip = "Previous"

[[window.normal.element]]
type = "button"
rect = [29, 1, 12, 12]
normal = { file = "bar/play.svg", area = [0, 0, 12, 12] }
pressed = { file = "bar/play.svg", area = [12, 0, 12, 12] }
hit = { file = "bar/play.svg", area = [0, 0, 12, 12] }
click = "play"
shift = "open-file"
ctrl = "open-url"
menu = "play"
tip = "Play"

[[window.normal.element]]
type = "button"
rect = [42, 1, 12, 12]
normal = { file = "bar/pause.svg", area = [0, 0, 12, 12] }
pressed = { file = "bar/pause.svg", area = [12, 0, 12, 12] }
hit = { file = "bar/pause.svg", area = [0, 0, 12, 12] }
click = "pause"
menu = "pause"
tip = "Pause"

[[window.normal.element]]
type = "button"
rect = [55, 1, 12, 12]
normal = { file = "bar/stop.svg", area = [0, 0, 12, 12] }
pressed = { file = "bar/stop.svg", area = [12, 0, 12, 12] }
hit = { file = "bar/stop.svg", area = [0, 0, 12, 12] }
click = "stop"
shift = "stop-fadeout"
ctrl = "stop-after-current"
menu = "stop"
tip = "Stop"

[[window.normal.element]]
type = "button"
rect = [68, 1, 12, 12]
normal = { file = "bar/next.svg", area = [0, 0, 12, 12] }
pressed = { file = "bar/next.svg", area = [12, 0, 12, 12] }
hit = { file = "bar/next.svg", area = [0, 0, 12, 12] }
click = "next"
shift = "fwd5s"
ctrl = "end-of-list"
menu = "next"
tip = "Next"

[[window.normal.element]]
type = "button"
rect = [81, 1, 12, 12]
normal = { file = "bar/eject.svg", area = [0, 0, 12, 12] }
pressed = { file = "bar/eject.svg", area = [12, 0, 12, 12] }
hit = { file = "bar/eject.svg", area = [0, 0, 12, 12] }
click = "open-file"
shift = "open-folder"
ctrl = "open-url"
menu = "eject"
tip = "Open"

[[window.normal.element]]
type = "image"
rect = [96, 1, 112, 12]
normal = "bar/display.svg"

[[window.normal.element]]
type = "image"
rect = [99, 3, 9, 9]
normal = { file = "main/status.svg", area = [0, 0, 9, 9] }
show = "playing"

[[window.normal.element]]
type = "image"
rect = [99, 3, 9, 9]
normal = { file = "main/status.svg", area = [9, 0, 9, 9] }
show = "paused"

[[window.normal.element]]
type = "image"
rect = [99, 3, 9, 9]
normal = { file = "main/status.svg", area = [18, 0, 9, 9] }
show = "stopped"

[[window.normal.element]]
type = "clock"
rect = [110, 2, 42, 10]
hide = "stopped"

[[window.normal.element]]
type = "button"
rect = [110, 2, 42, 10]
press = "toggle-time-mode"
menu = "time"

[[window.normal.element]]
type = "vis"
rect = [155, 3, 50, 8]

[[window.normal.element]]
type = "button"
rect = [155, 3, 50, 8]
press = "cycle-vis-mode"
menu = "vis"

[[window.normal.element]]
type = "image"
edges = [210, 1, 214, 13]
normal = "bar/lcd-left.svg"

[[window.normal.element]]
type = "image"
edges = [214, 1, "end-184", 13]
normal = "bar/lcd-tile.svg"
fill = "tile"

[[window.normal.element]]
type = "image"
edges = ["end-184", 1, "end-180", 13]
normal = "bar/lcd-right.svg"

[[window.normal.element]]
type = "marquee"
edges = [214, 2, "end-184", 9]
