tip = "Song Title (right-click for options)"
menu = "song-title"

[[window.normal.element]]
type = "slider"
edges = [213, 9, "end-183", 13]
value = "position"
thumb = { normal = { file = "bar/seek-thumb.svg", area = [0, 0, 12, 4] }, pressed = { file = "bar/seek-thumb.svg", area = [12, 0, 12, 4] } }
thumb_len = 12
live = false
show = "seekable"
cursor = "posbar"
menu = "seek"

[[window.normal.element]]
type = "slider"
edges = ["end-175", 3, "end-123", 11]
value = "volume"
track = { file = "bar/volume.svg", first = [0, 0, 52, 8], step = [0, 8], count = 28 }
thumb = { normal = { file = "bar/vol-thumb.svg", area = [0, 0, 8, 8] }, pressed = { file = "bar/vol-thumb.svg", area = [8, 0, 8, 8] } }
thumb_len = 8
reset = 200
wheel_step = 8
cursor = "volbal"
tip = "Volume"

[[window.normal.element]]
type = "toggle"
edges = ["end-118", 2, "end-94", 12]
normal = { file = "bar/eq.svg", area = [0, 0, 24, 10] }
pressed = { file = "bar/eq.svg", area = [24, 0, 24, 10] }
on = { file = "bar/eq.svg", area = [48, 0, 24, 10] }
on_pressed = { file = "bar/eq.svg", area = [72, 0, 24, 10] }
flag = "eq-window"
click = "toggle-eq-window"

[[window.normal.element]]
type = "toggle"
edges = ["end-93", 2, "end-69", 12]
normal = { file = "bar/pl.svg", area = [0, 0, 24, 10] }
pressed = { file = "bar/pl.svg", area = [24, 0, 24, 10] }
on = { file = "bar/pl.svg", area = [48, 0, 24, 10] }
on_pressed = { file = "bar/pl.svg", area = [72, 0, 24, 10] }
flag = "playlist-window"
click = "toggle-playlist-window"

[[window.normal.element]]
type = "toggle"
edges = ["end-68", 2, "end-44", 12]
normal = { file = "bar/shuffle.svg", area = [0, 0, 24, 10] }
pressed = { file = "bar/shuffle.svg", area = [24, 0, 24, 10] }
on = { file = "bar/shuffle.svg", area = [48, 0, 24, 10] }
on_pressed = { file = "bar/shuffle.svg", area = [72, 0, 24, 10] }
flag = "shuffle"
click = "toggle-shuffle"
menu = "shuffle"

[[window.normal.element]]
type = "toggle"
edges = ["end-43", 2, "end-19", 12]
normal = { file = "bar/repeat.svg", area = [0, 0, 24, 10] }
pressed = { file = "bar/repeat.svg", area = [24, 0, 24, 10] }
on = { file = "bar/repeat.svg", area = [48, 0, 24, 10] }
on_pressed = { file = "bar/repeat.svg", area = [72, 0, 24, 10] }
flag = "repeat"
click = "toggle-repeat"
menu = "repeat"

[[window.normal.element]]
type = "button"
edges = ["end-13", 2, "end-3", 12]
normal = { file = "common/close.svg", area = [0, 0, 10, 10] }
pressed = { file = "common/close.svg", area = [10, 0, 10, 10] }
click = "exit"
tip = "Close"

